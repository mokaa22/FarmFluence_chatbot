<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmFluence AI Assistant</title>

<style>
/* ====== BASE PAGE ====== */
body {
  margin: 0;
  height: 100vh;
  font-family: "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: url("/static/agri 1.jpg") no-repeat center center fixed;
  background-size: cover;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: -1;
}

/* ====== CHAT BOX ====== */
.chatbox {
  width: 420px;
  height: 620px;
  background: rgba(255,255,255,0.96);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

.header {
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: white;
  text-align: center;
  padding: 14px;
  font-weight: bold;
}

.messages {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  background: #f6f8f9;
  display: flex;
  flex-direction: column;
}

.msg {
  max-width: 85%;
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
}

.user {
  background: #e3f2fd;
  align-self: flex-end;
}

.bot {
  background: #e8f5e9;
  align-self: flex-start;
}

.input {
  display: flex;
  border-top: 1px solid #ddd;
}

input {
  flex: 1;
  border: none;
  padding: 12px;
  outline: none;
  font-size: 14px;
}

button {
  border: none;
  padding: 12px 14px;
  background: #2e7d32;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

/* ====== WAKE UP SCREEN ====== */
#wake-screen {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.97);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
}

.wake-box {
  text-align: center;
  max-width: 420px;
  padding: 30px;
  border-radius: 16px;
  background: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.wake-box h2 {
  color: #2e7d32;
  margin-bottom: 12px;
}

.wake-box p {
  font-size: 14px;
  color: #555;
  margin-bottom: 18px;
}

.timer {
  font-weight: bold;
  font-size: 16px;
  color: #1b5e20;
}
</style>
</head>

<body>

<!-- ====== WAKE UP OVERLAY ====== -->
<div id="wake-screen">
  <div class="wake-box">
    <h2>🌱 FarmFluence AI Assistant is starting</h2>
    <p>
      Our servers go to sleep when idle to save resources.<br>
      Please wait while we wake them up.
    </p>
    <div class="timer">
      Starting in <span id="countdown">40</span> seconds…
    </div>
  </div>
</div>

<!-- ====== CHAT UI ====== -->
<div class="chatbox">
  <div class="header">🌾 FarmFluence AI Assistant</div>

  <div class="messages" id="messages">
    <div class="msg bot">
      👋 Hello! I’m your FarmFluence AI assistant.<br>
      Ask me anything about your crops. Please enter your name and location.
    </div>
  </div>

  <div class="input">
    <input id="userInput" placeholder="Type or speak your question..." disabled />
    <button onclick="startListening()">🎙️</button>
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
/* ====== WAKE UP TIMER ====== */
let timeLeft = 40;
const countdownEl = document.getElementById("countdown");
const wakeScreen = document.getElementById("wake-screen");
const userInput = document.getElementById("userInput");

const wakeTimer = setInterval(() => {
  timeLeft--;
  countdownEl.innerText = timeLeft;

  if (timeLeft <= 0) {
    clearInterval(wakeTimer);
    wakeScreen.style.display = "none";
    userInput.disabled = false;
    userInput.focus();
  }
}, 1000);

/* ====== CHAT LOGIC ====== */
const API_URL = "/chat";
const messages = document.getElementById("messages");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  addMessage(text, "user");
  userInput.value = "";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    addMessage(data.reply, "bot");

  } catch {
    addMessage("⚠️ Unable to connect to FarmFluence AI", "bot");
  }
}

userInput.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

/* ====== VOICE INPUT ONLY ====== */
function startListening() {
  if (!("webkitSpeechRecognition" in window)) {
    alert("Voice input works only in Chrome");
    return;
  }

  const rec = new webkitSpeechRecognition();
  rec.lang = "en-IN";
  rec.continuous = false;

  rec.onresult = e => {
    userInput.value = e.results[0][0].transcript;
    sendMessage();
  };

  rec.start();
}
</script>

</body>
</html>
