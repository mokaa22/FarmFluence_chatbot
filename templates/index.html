<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmFluence AI Assistant</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url("/static/agri 1.jpg") no-repeat center center fixed;
  background-size: cover;
  background-color: #1b5e20;
}

/* Chat Container */
.chatbox {
  width: 420px;
  height: 85vh;
  max-height: 620px;
  background: rgba(255,255,255,0.96);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

/* Header */
.header {
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: white;
  text-align: center;
  padding: 14px;
  font-weight: bold;
}

/* Messages */
.messages {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  background: #f6f8f9;
  display: flex;
  flex-direction: column;
}

.msg {
  max-width: 85%;
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
}

.user {
  background: #e3f2fd;
  align-self: flex-end;
}

.bot {
  background: #e8f5e9;
  align-self: flex-start;
}

/* Input */
.input {
  display: flex;
  border-top: 1px solid #ddd;
  position: sticky;
  bottom: 0;
  background: white;
}

input {
  flex: 1;
  border: none;
  padding: 12px;
  outline: none;
  font-size: 14px;
}

button {
  border: none;
  padding: 12px 14px;
  background: #2e7d32;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

/* Wake-up overlay */
#wakeup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 999;
  display: none;
}

#wakeup span {
  font-size: 18px;
  margin-top: 12px;
}

/* Mobile fixes */
@media (max-width: 600px) {
  .chatbox {
    width: 95%;
    height: 90vh;
  }
}
</style>
</head>

<body>

<!-- Wake-up Screen -->
<div id="wakeup">
  <h2>🌾 FarmFluence AI Assistant is starting</h2>
  <p>Our servers sleep when idle to save resources.</p>
  <span>Waking up… <b id="countdown">45</b> sec</span>
</div>

<!-- Chat UI -->
<div class="chatbox" id="chatbox" style="display:none;">
  <div class="header">🌾 FarmFluence AI Assistant</div>

  <div class="messages" id="messages">
    <div class="msg bot">
      👋 Hello! I’m your FarmFluence AI assistant.<br>
      Ask me anything about agriculture.
    </div>
  </div>

  <div class="input">
    <input id="userInput" placeholder="Type or speak your question..." />
    <button onclick="startListening()">🎙️</button>
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API_URL = "/chat";
const HEALTH_URL = "/health";

const messages = document.getElementById("messages");
const userInput = document.getElementById("userInput");
const chatbox = document.getElementById("chatbox");
const wakeup = document.getElementById("wakeup");
const countdownEl = document.getElementById("countdown");

/* Check backend status */
async function checkBackend() {
  try {
    const res = await fetch(HEALTH_URL, { cache: "no-store" });
    if (res.ok) {
      wakeup.style.display = "none";
      chatbox.style.display = "flex";
      return;
    }
  } catch {}

  showWakeup();
}

/* Wake-up screen logic */
function showWakeup() {
  wakeup.style.display = "flex";
  let time = 45;

  const timer = setInterval(() => {
    time--;
    countdownEl.innerText = time;

    if (time <= 0) {
      clearInterval(timer);
      location.reload();
    }
  }, 1000);
}

/* Messages */
function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* Send message */
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  addMessage(text, "user");
  userInput.value = "";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    addMessage(data.reply, "bot");

  } catch {
    addMessage("⚠️ Unable to connect. Please wait…", "bot");
  }
}

/* Enter key */
userInput.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

/* Voice INPUT only */
function startListening() {
  if (!("webkitSpeechRecognition" in window)) {
    alert("Voice input works only in Chrome");
    return;
  }

  const rec = new webkitSpeechRecognition();
  rec.lang = "en-IN";
  rec.continuous = false;

  rec.onresult = e => {
    userInput.value = e.results[0][0].transcript;
    sendMessage();
  };

  rec.start();
}

/* Auto scroll on keyboard open */
window.addEventListener("resize", () => {
  messages.scrollTop = messages.scrollHeight;
});

/* Start */
checkBackend();
</script>

</body>
</html>
