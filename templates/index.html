<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmFluence AI Assistant</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: url("/static/agri 1.jpg") no-repeat center center fixed;
  background-size: cover;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: -1;
}

/* Chat Box */
.chatbox {
  width: 420px;
  height: 620px;
  background: rgba(255,255,255,0.96);
  border-radius: 16px;
  display: none;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

.header {
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: white;
  text-align: center;
  padding: 14px;
  font-weight: bold;
}

.messages {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  background: #f6f8f9;
  display: flex;
  flex-direction: column;
}

.msg {
  max-width: 85%;
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
}

.user {
  background: #e3f2fd;
  align-self: flex-end;
}

.bot {
  background: #e8f5e9;
  align-self: flex-start;
}

.input {
  display: flex;
  border-top: 1px solid #ddd;
}

input {
  flex: 1;
  border: none;
  padding: 12px;
  outline: none;
  font-size: 14px;
}

button {
  border: none;
  padding: 12px 14px;
  background: #2e7d32;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

/* Wake Screen */
#wakeScreen {
  width: 420px;
  height: 260px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
}

#wakeScreen h2 {
  color: #2e7d32;
  margin-bottom: 10px;
}

#wakeScreen p {
  color: #555;
  font-size: 14px;
}

#countdown {
  margin-top: 12px;
  font-weight: bold;
  color: #2e7d32;
}
</style>
</head>

<body>

<!-- Wake Screen -->
<div id="wakeScreen">
  <h2>🌱 FarmFluence AI Assistant is starting</h2>
  <p>
    Our servers go to sleep when idle to save resources.<br>
    Please wait while we wake them up.
  </p>
  <div id="countdown">Starting in 40 seconds...</div>
</div>

<!-- Chat UI -->
<div class="chatbox" id="chatbox">
  <div class="header">🌾 FarmFluence AI Assistant</div>

  <div class="messages" id="messages">
    <div class="msg bot">
      👋 Hello! I’m your FarmFluence AI assistant.<br>
      Ask me anything about your crops.
    </div>
  </div>

  <div class="input">
    <input id="userInput" placeholder="Type or speak your question..." />
    <button onclick="startListening()">🎙️</button>
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API_URL = "/chat";
const HEALTH_URL = "/health";

const chatbox = document.getElementById("chatbox");
const wakeScreen = document.getElementById("wakeScreen");
const countdownEl = document.getElementById("countdown");

const messages = document.getElementById("messages");
const userInput = document.getElementById("userInput");

/* ---------- Utility ---------- */
function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* ---------- Chat ---------- */
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  addMessage(text, "user");
  userInput.value = "";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    addMessage(data.reply, "bot");

  } catch {
    addMessage("⚠️ Unable to connect to FarmFluence AI", "bot");
  }
}

userInput.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

/* ---------- Voice INPUT only ---------- */
function startListening() {
  if (!("webkitSpeechRecognition" in window)) {
    alert("Voice input works only in Chrome");
    return;
  }

  const rec = new webkitSpeechRecognition();
  rec.lang = "en-IN";
  rec.continuous = false;

  rec.onresult = e => {
    userInput.value = e.results[0][0].transcript;
    sendMessage();
  };

  rec.start();
}

/* ---------- Wake Logic ---------- */
function fetchWithTimeout(resource, timeout = 3000) {
  return Promise.race([
    fetch(resource),
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("timeout")), timeout)
    )
  ]);
}

async function checkBackend() {
  try {
    await fetchWithTimeout(HEALTH_URL, 3000);
    return true;
  } catch {
    return false;
  }
}

function showChat() {
  wakeScreen.style.display = "none";
  chatbox.style.display = "flex";
}

function showWakeScreen() {
  wakeScreen.style.display = "flex";
  chatbox.style.display = "none";
}

async function startApp() {
  const isAwake = await checkBackend();

  if (isAwake) {
    showChat();
    return;
  }

  // Backend sleeping
  showWakeScreen();

  let seconds = 40;
  countdownEl.innerText = `Starting in ${seconds} seconds...`;

  const countdown = setInterval(async () => {
    seconds--;
    countdownEl.innerText = `Starting in ${seconds} seconds...`;

    const awake = await checkBackend();
    if (awake || seconds <= 0) {
      clearInterval(countdown);
      showChat();
    }
  }, 1000);
}

startApp();
</script>

</body>
</html>
