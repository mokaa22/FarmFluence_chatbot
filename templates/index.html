<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmFluence Dashboard</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("/static/agri 1.jpg") no-repeat center center fixed;
      background-size: cover;
      background-color: #1b5e20;
    }

    /* Optional placeholder content */
    .page-content {
      padding: 40px;
      color: white;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      max-width: 600px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- Optional page content (dashboard / landing) -->
  <div class="page-content">
    <h1>🌾 FarmFluence Dashboard</h1>
    <p>
      Welcome to FarmFluence.  
      Use the chatbot in the bottom-right corner to get instant
      AI-powered farming guidance.
    </p>
  </div>

  <!-- ===============================
       FarmFluence Chatbot Widget
       =============================== -->
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "/static/widget/chatbot.js";
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>

</body>
</html>
